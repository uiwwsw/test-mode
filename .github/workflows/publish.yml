name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on main (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate tag, package version and main ancestry
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      - run: npm ci
      - name: Check whether this commit was already published
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${name}/${version}`, { signal: AbortSignal.timeout(15000) });
          if (response.ok) {
            const published = await response.json();
            const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            assert.equal(published.name, name);
            assert.equal(published.version, version);
            assert.equal(published.gitHead, head, 'This version belongs to a different commit; release a new version.');
            appendFileSync(process.env.GITHUB_ENV, 'NPM_ALREADY_PUBLISHED=true\n');
            console.log(`${name}@${version} was already published from this commit.`);
          } else if (response.status !== 404) {
            throw new Error(`Registry preflight failed: HTTP ${response.status}`);
          }
          JS
      - name: Publish verified package with provenance
        if: env.NPM_ALREADY_PUBLISHED != 'true'
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
        env:
          # Used for initial publication; npm also supports OIDC after trusted publisher setup.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry version with propagation retries
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const response = await fetch(`https://registry.npmjs.org/${name}/${version}`, { signal: AbortSignal.timeout(15000) });
              if (!response.ok) throw new Error(`Registry returned HTTP ${response.status}`);
              const published = await response.json();
              assert.equal(published.name, name);
              assert.equal(published.version, version);
              assert.equal(published.gitHead, head);
              assert.ok(published.dist?.integrity, 'Missing package integrity');
              assert.ok(published.dist?.attestations?.provenance, 'Missing provenance');
              console.log(`Verified ${name}@${version}: ${published.dist.integrity}`);
              break;
            } catch (error) {
              if (attempt === 12) throw error;
              console.log(`Registry verification attempt ${attempt}/12: ${error.message}. Retrying in 10 seconds.`);
              await setTimeout(10000);
            }
          }
          JS
